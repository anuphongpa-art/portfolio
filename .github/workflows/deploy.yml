name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static post pages & sitemap
        run: node build.js

      - name: Prepare deploy folder
        run: |
          mkdir dist
          cp index.html about.html blog.html editor.html post.html style.css script.js favicon.svg sitemap.xml dist/
          cp -r images dist/
          if [ -d posts ]; then cp -r posts dist/; else mkdir -p dist/posts; fi
          if [ -d blog ]; then cp -r blog dist/; else mkdir -p dist/blog; fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 91fa96aa18a0bb0836f188ce5048d18a
